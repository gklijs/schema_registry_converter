[package]
name = "schema_registry_converter"
version = "5.1.0"
authors = ["Gerard Klijs <g.klijs@gmail.com>"]
include = ["src/**/*", "Cargo.toml"]
description = "Encode/decode Avro, Protobuf and JSON Schema data from/to Kafka using the Confluent Schema Registry"
homepage = "https://github.com/gklijs/schema_registry_converter"
repository = "https://github.com/gklijs/schema_registry_converter"
readme = "README.md"
keywords = ["kafka", "confluent", "schema-registry", "avro", "protobuf"]
categories = ["encoding", "api-bindings", "asynchronous"]
license = "MIT OR Apache-2.0"
edition = "2024"
# The highest version the dependencies require, apache-avro needs 1.88. Checked by the msrv CI job.
rust-version = "1.88"

# Edition 2024 implies resolver 3, which resolves dependencies to versions that support the
# rust-version above, see https://doc.rust-lang.org/cargo/reference/resolver.html#rust-version
[workspace]

[features]
native_tls = ["reqwest/native-tls"]
rustls_tls = ["reqwest/rustls"]

# The async implementations, see async_impl.
futures = ["dep:futures"]
avro = ["dep:apache-avro"]
blocking = ["reqwest/blocking"]
json = ["dep:jsonschema", "dep:url"]
middleware = ["dep:reqwest-middleware"]
proto_decoder = [
    "dep:integer-encoding",
    "dep:prost-reflect",
    "dep:prost-types",
    "dep:protox",
    "dep:protox-parse",
]
proto_raw = ["dep:integer-encoding", "dep:prost-types", "dep:protox-parse"]
proto_encoder = [
    "dep:integer-encoding",
    "dep:prost-reflect",
    "prost-reflect/serde",
    "dep:prost-types",
    "dep:protox",
    "dep:protox-parse",
]
easy = []
kafka_test = []
default = ["futures", "native_tls"]

[dependencies.byteorder]
version = "^1.5"

[dependencies.dashmap]
version = "^6.1"

[dependencies.reqwest]
version = "^0.13"
default-features = false
features = ["json"]

[dependencies.reqwest-middleware]
version = "^0.5"
default-features = false
optional = true

[dependencies.serde]
version = "^1.0"
features = ["derive"]

[dependencies.serde_json]
version = "^1.0"

[dependencies.apache-avro]
version = "^0.22"
optional = true

[dependencies.futures]
version = "^0.3"
optional = true

[dependencies.jsonschema]
version = "^0.59"
# Referenced schemas come from the schema registry, so retrieving them over http or from files
# isn't needed.
default-features = false
optional = true

[dependencies.integer-encoding]
version = "^4.0"
optional = true

[dependencies.prost-reflect]
version = "^0.16"
optional = true

[dependencies.prost-types]
version = "^0.14"
optional = true

[dependencies.protox]
version = "^0.10"
optional = true

[dependencies.protox-parse]
version = "^0.10"
optional = true

[dependencies.url]
version = "^2.5"
optional = true


[dev-dependencies]
# `derive` is only needed for tests/doctests exercising `avro_common::get_supplied_schema_for`
# via `#[derive(apache_avro::AvroSchema)]` -- unified with the plain `apache-avro` optional
# dependency (see the `avro` feature) when both are active in the same build.
apache-avro = { version = "^0.22", features = ["derive"] }
async-trait = "^0.1"
criterion = "^0.8"
http = "^1.0"
mockito = "^1.7.0"
rdkafka = { version = "^0.39.0", features = ["cmake-build", "curl-static"] }
rand = "^0.10.0"
test_utils = { path = "test_utils" }
tokio = { version = "^1.46.1", features = ["macros"] }

[package.metadata.docs.rs]
all-features = true

# Benchmarks of the blocking API's hot path (schema already cached), see
# https://github.com/gklijs/schema_registry_converter/issues/118. Each one needs its matching
# format feature plus `blocking`, so run e.g. `cargo bench --features avro,blocking` for a single
# group, or `cargo bench --all-features` for all of them.
[[bench]]
name = "avro_bench"
harness = false
required-features = ["avro", "blocking"]

[[bench]]
name = "proto_raw_bench"
harness = false
required-features = ["proto_raw", "blocking"]

[[bench]]
name = "proto_decoder_bench"
harness = false
required-features = ["proto_decoder", "blocking"]

[[bench]]
name = "json_bench"
harness = false
required-features = ["json", "blocking"]
