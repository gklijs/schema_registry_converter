name: CI

on: [push, pull_request]

# A push and its PR both trigger this workflow, and every new push superseded an
# already-running one anyway -- cancel it instead of letting both run to completion (or hang,
# see CARGO_MAKE_SKIP_CODECOV below) in parallel.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-C link-dead-code"
  CARGO_MAKE_RUN_CODECOV: true
  # cargo-make's `codecov` task pipes `curl -s https://codecov.io/bash` straight into `bash` --
  # Codecov's now-deprecated bash uploader. It was intermittently hanging CI builds for 30+
  # minutes until manually cancelled (observed on PR #189, unrelated to that PR's own changes).
  # Skip just that sub-task; the rest of ci-coverage-flow (installing kcov and generating an
  # actual coverage report) still runs as before -- verified locally with
  # `cargo make --makefile make.toml ci-coverage-flow -v` that execution reaches
  # `coverage-kcov` but the `codecov` task itself is never invoked with this flag set. Restoring
  # a working upload (e.g. the codecov GitHub Action instead of the bash uploader) is a
  # separate, deliberate piece of work.
  CARGO_MAKE_SKIP_CODECOV: true
  CODECOV_TOKEN: ee9fe20a-5285-4805-b1a9-5af664534997

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - uses: Swatinem/rust-cache@v2
        # This job has never cached dependencies -- every push did a fully cold rebuild of the
        # whole tree, including cargo-make's own ci-flow (build/clippy/test all over again) and
        # the benchmarks step's dev-dependencies (criterion pulls in a dozen-plus extra crates:
        # clap, plotters, rayon, ciborium, ...). See
        # https://github.com/gklijs/schema_registry_converter/issues/118 for where the time was
        # actually going (ci-flow ~58%, benchmarks ~21% of a ~23 minute run).
      - name: Install
        run: cargo install --debug cargo-make
      - name: Build
        run: cargo build --verbose
      - name: prepare env
        run: docker compose up -d
      - name: check test app done
        run: ./check_test_app_done.sh
        shell: bash
      - name: prepare integration test
        run: ./prepare_integration_test.sh
        shell: bash
      - name: test
        run: cargo test --verbose --all-features -- --test-threads=1
      - name: ci-flow
        run: cargo make --makefile make.toml ci-flow
      - name: benchmarks
        # See https://github.com/gklijs/schema_registry_converter/issues/118. Shared runners are
        # too noisy for reliable pass/fail thresholds, so this just prints timings to the job log
        # for a human to eyeball across PRs rather than gating the build on them -- so it's fine
        # to trim criterion's default sampling (100 samples / 3s+5s per benchmark) down to keep
        # this step's cost reasonable; same values scripts/run_bench_pass.sh uses.
        run: cargo bench --all-features -- --sample-size 60 --measurement-time 3 --warm-up-time 2
        continue-on-error: true
