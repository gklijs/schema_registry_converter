name: CI

on: [push, pull_request]

# A push and its PR both trigger this workflow, and every new push superseded an
# already-running one anyway -- cancel it instead of letting both run to completion in parallel.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        # See https://github.com/gklijs/schema_registry_converter/issues/118 for where the time
        # was going before dependencies were cached.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Build
        run: cargo build --verbose
      - name: prepare env
        run: docker compose up -d
      - name: check test app done
        run: ./check_test_app_done.sh
        shell: bash
      - name: prepare integration test
        run: ./prepare_integration_test.sh
        shell: bash
      - name: test
        # Runs the unit and integration tests once, instrumented by the compiler. Unlike line
        # based tools like kcov, this measures regions, so an assert's never-taken panic branch
        # or a closing parenthesis on its own line doesn't count as a miss.
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info -- --test-threads=1
      - name: doc tests
        # cargo-llvm-cov only instruments doc tests on nightly.
        run: cargo test --doc --all-features
      - name: upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          # Coverage is informative only, an unavailable Codecov shouldn't fail the build.
          fail_ci_if_error: false
      - name: benchmarks
        # See https://github.com/gklijs/schema_registry_converter/issues/118. Shared runners are
        # too noisy for reliable pass/fail thresholds, so this just prints timings to the job log
        # for a human to eyeball across PRs rather than gating the build on them -- so it's fine
        # to trim criterion's default sampling (100 samples / 3s+5s per benchmark) down to keep
        # this step's cost reasonable; same values scripts/run_bench_pass.sh uses.
        run: cargo bench --all-features -- --sample-size 60 --measurement-time 3 --warm-up-time 2
        continue-on-error: true

  msrv:
    # Checks the library still builds with the `rust-version` from Cargo.toml. Only the library
    # itself, as the tests and benches may need newer dev-dependencies.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check with the minimum supported Rust version
        run: cargo check --lib --all-features

  docs:
    # The documentation as docs.rs builds it, failing on broken links and other rustdoc
    # warnings.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Check the documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"
